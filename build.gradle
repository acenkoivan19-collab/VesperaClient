plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

// NanoVG + нативные библиотеки внутрь jar
apply from: "nanovg.gradle"

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = "UTF-8"
}

// ---------------------------------------------------------------------------
// После каждой сборки готовый jar автоматически кладётся в папку лаунчера.
// Старые версии мода оттуда удаляются, чтобы не было дублей.
// ---------------------------------------------------------------------------
def launcherModsDir = file(project.findProperty("launcher_mods_dir") ?: "F:/usermods/1.21.11")

tasks.register("deployToLauncher", Copy) {
    group = "launcher"
    description = "Copies the built mod jar into the launcher mods folder"
    dependsOn tasks.named("remapJar")
    from tasks.named("remapJar").flatMap { it.archiveFile }
    into launcherModsDir
    doFirst {
        // и vespera-client-1.0.0.jar (локальная сборка), и vespera-client.jar (скачан из релиза)
        delete fileTree(launcherModsDir) { include "${project.archives_base_name}*.jar", "launcher-client-*.jar" }
    }
}

// Копируем в лаунчер только при локальной сборке на ПК (папка существует, это не GitHub Actions).
tasks.named("build") {
    if (System.getenv("CI") == null && launcherModsDir.exists()) finalizedBy "deployToLauncher"
}
