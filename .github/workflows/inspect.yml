name: inspect
on:
  workflow_dispatch:
    inputs:
      classes:
        description: "классы через пробел"
        required: true
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1
      - run: gradle compileJava --no-daemon -x test
      - run: |
          JAR=$(find ~/.gradle/caches .gradle -path '*minecraft*' -name '*.jar' 2>/dev/null | grep -i -E 'merged.*yarn|named|mapped' | grep -v sources | head -1)
          echo "JAR=$JAR"
          for c in ${{ github.event.inputs.classes }}; do echo "=== $c"; javap -p -cp "$JAR" "$c" || true; done
